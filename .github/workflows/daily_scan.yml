name: Daily Stock Scan

on:
  schedule:
    - cron: '0 6 * * *' # UTC 06:00 = 台灣時間 14:00
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Run Pipeline
        run: |
          python fetch_stock_list.py
          python scanner.py
      
      - name: Commit results
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # 【心跳機制】：產生或更新一個 timestamp 檔案，確保每天都有變動
          echo "Last run: $(date)" > heartbeat.txt
          
          # 強制加入 csv 檔與心跳檔
          git add -f small_cap_list.csv results.csv heartbeat.txt
          
          # 若有變動則提交並推送到 GitHub (因為 heartbeat.txt 每天都會變，這保證了一定會 Commit)
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update: Scan results and keep-alive" && git push)
