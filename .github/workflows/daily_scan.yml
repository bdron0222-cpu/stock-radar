name: Daily Stock Scan

on:
  schedule:
    - cron: '0 6 * * *' # UTC 06:00 = 台灣時間 14:00
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # 建議使用 3.10+
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Run Pipeline
        # 使用 && 確保 get_tickers 成功後才執行 scanner
        run: |
          python get_tickers.py
          python scanner.py
      
      - name: Commit results
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # 強制加入 csv 檔
          git add -f results.csv
          # 若有變動則提交並推送到 GitHub
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update: Scan results" && git push)