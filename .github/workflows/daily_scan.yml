name: Daily Stock Scan

on:
  schedule:
    - cron: '0 6 * * *' # UTC 早上 6 點 = 台灣時間 下午 2 點
  workflow_dispatch:    # 允許手動觸發

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4  # 升級到 v4 以解決 Node.js 警告

      - name: Set up Python
        uses: actions/setup-python@v5  # 升級到 v5
        with:
          python-version: '3.9'
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Run scanner
        run: python scanner.py
      
      - name: Commit results
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # -f 參數強制無視 .gitignore，這是解決衝突的關鍵
          git add -f results.csv
          # 檢查是否有變動，有的話才 commit
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update scan results" && git push)
