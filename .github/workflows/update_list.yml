name: Monthly Stock List Update

on:
  schedule:
    # 每 3 個月的第 1 天，凌晨 00:00 執行
    - cron: '0 0 1 */3 *' 
  workflow_dispatch: 

jobs:
  update-list:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: pip install pandas requests
      
      - name: Fetch and Process List
        # 移除了 get_tickers.py，因為 fetch_stock_list.py 已經完成所有工作
        run: |
          python fetch_stock_list.py
      
      - name: Commit updated list
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # 只 add 真正產出的檔案：small_cap_list.csv
          git add small_cap_list.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update: Refresh stock list" && git push)